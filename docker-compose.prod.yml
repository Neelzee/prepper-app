services:
  database:
    image: postgres:18.6
    env_file: .env
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
  backend:
    image: ghcr.io/neelzee/prepper-backend:${IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    depends_on:
      database: { condition: service_healthy }
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:5433:5432"
    volumes:
      - static:/app/static
      - data:/app/data
volumes:
  pgdata:
  static:
  data: