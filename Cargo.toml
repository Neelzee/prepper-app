[workspace]
resolver = "3"
members = ["printer-agent", "app/src-tauri", "prepper-backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
actix-files = "0.7.4"
actix-multipart = "0.8.8"
actix-web = "4.19.0"
anyhow = "1.0.104"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["actix-web-4"] }
bcrypt = "0.19.3"
chrono = "0.4.45"
diesel = { version = "2.4.0", features = ["postgres", "serde_json", "r2d2"] }
diesel_migrations = "2.4.0"
dotenvy = "0.15.7"
env_logger = "0.11.11"
ics = "0.5.8"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
log = "0.4.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
uuid = { version = "1.29.2", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
